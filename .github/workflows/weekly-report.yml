name: Weekly Benchmark Report

on:
  schedule:
    # GitHub cron is UTC: Monday 00:00 UTC = Monday 08:00 Asia/Shanghai.
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-benchmark-main
  cancel-in-progress: false

jobs:
  benchmark:
    # Use the same native, headed Chrome environment validated by this project.
    # Run the runner as an interactive Windows user, not a Windows service.
    runs-on: [self-hosted, windows]
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PYTHONUNBUFFERED: "1"
      RUN_DIR: artifacts/weekly-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout main and vendor snapshots
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and run offline regression tests
        run: |
          python -m pip install -r requirements.txt playwright
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw "Regression tests failed" }
          ./tests/test_weekly_shell.ps1
          if (-not $?) { throw "PowerShell integration tests failed" }

      - name: Check runner prerequisites and choose Shanghai corpus date
        run: |
          if (-not [Environment]::UserInteractive) {
            throw "Headed Chrome requires an interactive Windows runner. Run run.cmd as a logged-in user instead of a Windows service."
          }
          if (-not (Test-Path "lib/rime.dll")) { throw "Missing lib/rime.dll" }
          $chromePaths = @(
            "$env:ProgramFiles/Google/Chrome/Application/chrome.exe",
            "${env:ProgramFiles(x86)}/Google/Chrome/Application/chrome.exe",
            "$env:LOCALAPPDATA/Google/Chrome/Application/chrome.exe"
          )
          if (-not ($chromePaths | Where-Object { Test-Path $_ })) { throw "Install Google Chrome for this runner user" }
          $today = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([datetime]::UtcNow, "China Standard Time").ToString("yyyy-MM-dd")
          "CORPUS_DATE=$today" >> $env:GITHUB_ENV
          "CORPUS_PATH=data/corpus/zhihu_hotlist_$today.txt" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Path "$env:RUN_DIR/results", "$env:RUN_DIR/report" -Force | Out-Null

      - name: Restore verified model download cache
        uses: actions/cache@v4
        with:
          path: .cache/benchmark-models
          key: benchmark-models-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            benchmark-models-${{ runner.os }}-

      - name: Update all upstream scheme sources
        run: |
          git submodule sync --recursive
          if ($LASTEXITCODE -ne 0) { throw "Submodule sync failed" }
          git submodule update --init --recursive --remote
          if ($LASTEXITCODE -ne 0) { throw "Upstream scheme update failed" }

      - name: Prepare all eleven vendors and verified current models
        run: |
          python scripts/setup_benchmark_vendors.py
          if ($LASTEXITCODE -ne 0) { throw "Vendor/model preparation failed" }

      - name: Fetch today's Zhihu answer bodies
        run: |
          $profile = Join-Path $env:RUNNER_TEMP "rime-zhihu-profile"
          python scripts/download_zhihu_hotlist.py --headed --browser-channel chrome --profile-dir $profile --require-bodies --require-all-bodies --limit 30 --answers 3 --out $env:CORPUS_PATH 2>&1 | Tee-Object -FilePath "$env:RUN_DIR/download.log"
          if ($LASTEXITCODE -ne 0) { throw "Answer download failed; existing reports will not be published over" }

      - name: Benchmark today's corpus into staging reports
        env:
          RIME_DLL: ${{ github.workspace }}\lib\rime.dll
        run: |
          ./scripts/run_test.ps1 -Corpus $env:CORPUS_PATH -ArtifactsDir "$env:RUN_DIR/results" -ReportDir "$env:RUN_DIR/report" -DateFormat "'${env:CORPUS_DATE}'" 2>&1 | Tee-Object -FilePath "$env:RUN_DIR/benchmark.log"
          if (-not $?) { throw "Benchmark failed" }

      - name: Validate all results before publishing
        run: |
          python scripts/validate_weekly_benchmark.py --corpus $env:CORPUS_PATH --artifacts "$env:RUN_DIR/results" --date $env:CORPUS_DATE --min-sentences 100 --report-dir "$env:RUN_DIR/report"
          if ($LASTEXITCODE -ne 0) { throw "Validation failed; keeping previous published reports" }
          Copy-Item "$env:RUN_DIR/report/latest.md" report/latest.md -Force
          Copy-Item "$env:RUN_DIR/report/$env:CORPUS_DATE.md" "report/$env:CORPUS_DATE.md" -Force

      - name: Upload run evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/weekly-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push validated reports, corpus and scheme snapshots
        run: |
          $paths = @(
            "report/latest.md", "report/${env:CORPUS_DATE}.md",
            "data/corpus/zhihu_hotlist_${env:CORPUS_DATE}.txt",
            "data/corpus/zhihu_hotlist_${env:CORPUS_DATE}.meta.json",
            "vendor/mingyuepinyin", "vendor/rime-frost", "vendor/rime-frost_with_gram",
            "vendor/rime-ice", "vendor/rime_wanxiang", "vendor/rime_wanxiang_with_gram",
            "vendor/rime-wubi-sentence"
          )
          git config user.name "github-actions[bot]"
          if ($LASTEXITCODE -ne 0) { throw "Git user configuration failed" }
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ($LASTEXITCODE -ne 0) { throw "Git email configuration failed" }
          git add -- @paths
          if ($LASTEXITCODE -ne 0) { throw "Staging validated output failed" }
          git diff --cached --quiet
          $changes = $LASTEXITCODE
          if ($changes -eq 0) { Write-Output "No validated output changes"; exit 0 }
          if ($changes -ne 1) { throw "Unable to inspect staged changes" }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw "Staged output has whitespace errors" }
          git commit -m "docs(report): refresh weekly Zhihu benchmark and scheme snapshots"
          if ($LASTEXITCODE -ne 0) { throw "Report commit failed" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Report push failed; no force push or history rewrite attempted" }
